<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Permite tildes y ñ -->
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte a celulares (responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme School - Plataforma de exámenes</title>

  <!-- Conectamos la hoja de estilos -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Aquí irá la barra de navegación (Etapa 3) -->
  <header id="encabezado"></header>

  <!-- Contenedor principal: aquí JavaScript mostrará cada pantalla -->
  <main id="app"></main>

  <!--
    type="module" permite usar import/export entre archivos JS.
    Los módulos se cargan después del HTML, así que #app ya existe
    cuando el script se ejecuta.
  -->
  <script type="module" src="js/principal.js"></script>
</body>
</html>
